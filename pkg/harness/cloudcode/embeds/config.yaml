harness: cloudcode
image: us-west1-docker.pkg.dev/mjk-agent-memory-service/scion/scion-cloudcode:latest
user: scion
provisioner:
  type: builtin
  interface_version: 1
config_dir: .config/cloudcode
skills_dir: .config/cloudcode/skills
interrupt_key: C-c
instructions_file: .config/cloudcode/AGENTS.md
command:
  # Bare `cloudcode` launches the interactive TUI (the CLI default) and
  # stays alive inside tmux for attach/sit semantics. A task, when
  # provided, is delivered via --prompt, which seeds the TUI prompt
  # WITHOUT dropping to one-shot mode (mirrors gemini's
  # --prompt-interactive). The earlier base ["cloudcode","run"] was the
  # one-shot mode and exited immediately (exit 0) whenever no task was
  # supplied, taking the tmux session and container down with it.
  base: ["cloudcode"]
  resume_flag: "--continue"
  task_flag: "--prompt"
  task_position: after_base_args
capabilities:
  limits:
    max_turns: { support: "yes" }
    max_model_calls: { support: "yes" }
    max_duration: { support: "yes" }
  telemetry:
    enabled: { support: "yes" }
    native_emitter: { support: "no" }
  prompts:
    system_prompt: { support: "yes" }
    agent_instructions: { support: "yes" }
  auth:
    api_key: { support: "yes" }
    oauth_token: { support: "yes" }
    auth_file: { support: "no" }
    vertex_ai: { support: "yes" }
auth:
  default_type: vertex-ai
  types:
    api-key:
      required_env:
        - any_of: ["GEMINI_API_KEY", "GOOGLE_API_KEY", "ANTHROPIC_API_KEY"]
    vertex-ai:
      required_env:
        - any_of: ["GOOGLE_CLOUD_PROJECT"]
        - any_of: ["GOOGLE_CLOUD_REGION", "CLOUD_ML_REGION", "GOOGLE_CLOUD_LOCATION"]
      required_files:
        - name: gcloud-adc
          type: file
          description: "Google Cloud Application Default Credentials file"
          alternative_env_keys: ["GOOGLE_APPLICATION_CREDENTIALS"]
          skipped_when_gcp_service_account_assigned: true
          required: true
  autodetect:
    env:
      GEMINI_API_KEY: api-key
      GOOGLE_API_KEY: api-key
      ANTHROPIC_API_KEY: api-key
      GOOGLE_APPLICATION_CREDENTIALS: vertex-ai
      GOOGLE_CLOUD_PROJECT: vertex-ai
    files:
      gcloud-adc: vertex-ai
