# Cloud Build configuration for rebuilding scion-base + all harnesses
# This is the most common rebuild: updates sciontool/config then rebuilds harnesses
# Skips core-base (uses existing core-base:<_TAG>)
# Pipeline: scion-base -> all harnesses (using freshly built scion-base)
steps:
  # Pre-flight: verify push access to catch permission errors early
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'verify-registry'
    entrypoint: 'bash'
    args: ['image-build/scripts/verify-registry.sh', '$_REGISTRY']

  # Enable multi-arch builds
  - name: 'gcr.io/cloud-builders/docker'
    id: 'setup-buildx'
    args: ['buildx', 'create', '--name', 'mybuilder', '--use']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'bootstrap-buildx'
    args: ['buildx', 'inspect', '--bootstrap']
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # 1. Build and push scion-base image (uses existing core-base:<_TAG>)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-base'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/core-base:$_TAG'
      - '--build-arg'
      - 'GIT_COMMIT=$_COMMIT_SHA'
      - '-t'
      - '$_REGISTRY/scion-base:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-base:$_TAG'
      - '-f'
      - 'image-build/scion-base/Dockerfile'
      - '--pull'
      - '--push'
      - '.'
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # 2. Build Gemini Harness Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-gemini'
    dir: 'image-build/gemini'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-gemini:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-gemini:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '--pull'
      - '--push'
      - '.'
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # 3. Build Cloudcode Harness Image
  # NB: image-build/cloudcode/_bin/cloudcode (~489MB linux/amd64 prebuilt
  # internal binary) must be staged into the build context before submit.
  # On operator workstations, fleet-apply copies the binary from
  # $cloudcode_linux to ~/dev/bin/cloudcode-linux-amd64; the
  # image-build/scripts/stage-cloudcode.sh helper (or a manual cp) places
  # it under image-build/cloudcode/_bin/cloudcode. No external network
  # download — there's no public release URL for the binary.
  #
  # We use linux/amd64 only (single arch); the cloudcode binary is
  # x86-64-only today and a multi-arch build would fail on the arm64 leg.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-cloudcode'
    dir: 'image-build/cloudcode'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-cloudcode:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-cloudcode:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '--pull'
      - '--push'
      - '.'
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

  # 4. Build Hub Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-scion-hub'
    dir: 'image-build/hub'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--build-arg'
      - 'BASE_IMAGE=$_REGISTRY/scion-base:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-hub:$_SHORT_SHA'
      - '-t'
      - '$_REGISTRY/scion-hub:$_TAG'
      - '-f'
      - 'Dockerfile'
      - '--pull'
      - '--push'
      - '.'
    env:
      - 'DOCKER_CLI_EXPERIMENTAL=enabled'

substitutions:
  _REGISTRY: 'us-central1-docker.pkg.dev/${PROJECT_ID}/public-docker'
  _TAG: 'latest'
options:
  dynamicSubstitutions: true
  machineType: 'E2_HIGHCPU_8'
timeout: 3600s # 1 hour - scion-base + all harnesses
